<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f7;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            color: #181818;
        }

        .login-box {
            width: 350px;

            background: white;

            padding: 42px;

            border-radius: 24px;

            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;

            font-size: 25px;
            font-weight: 700;

            margin-bottom: 30px;
        }

        h1 {
            text-align: center;

            margin: 0;

            font-size: 30px;

            letter-spacing: -1px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-top: 8px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 11px;

            font-size: 15px;

            outline: none;

            background: #fafafa;

            transition: 0.2s;

            margin-bottom: 15px;
        }

        input:focus {
            border-color: #111;
            background: white;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        /* FACCINA */

        .face-button {
            position: absolute;

            right: 7px;
            top: 4px;

            width: 42px;
            height: 42px;

            background: transparent;

            border: none;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .face {
            width: 27px;
            height: 27px;

            border: 2px solid #333;

            border-radius: 50%;

            position: relative;

            transition: 0.2s;
        }

        .eye {
            position: absolute;

            top: 8px;

            width: 4px;
            height: 4px;

            background: #333;

            border-radius: 50%;

            transition: 0.2s;
        }

        .eye-left {
            left: 6px;
        }

        .eye-right {
            right: 6px;
        }

        .mouth {
            position: absolute;

            width: 9px;
            height: 4px;

            border-bottom: 2px solid #333;

            border-radius: 50%;

            bottom: 5px;
            left: 7px;
        }

        .face-button:hover .eye {
            height: 1px;

            border-radius: 0;

            top: 10px;
        }

        .face-button:hover .face {
            transform: scale(1.08);
        }

        /* PASSWORD DIMENTICATA */

        .forgot {
            display: block;

            text-align: right;

            margin-top: -5px;
            margin-bottom: 22px;

            font-size: 13px;

            color: #666;

            text-decoration: none;
        }

        .forgot:hover {
            color: black;
        }

        /* TASTO LOGIN */

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background: #111;

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #333;

            transform: translateY(-1px);
        }

        #errore {
            text-align: center;

            font-size: 13px;

            color: #d93025;

            margin-top: 15px;
        }

        .register {
            margin-top: 25px;

            text-align: center;

            font-size: 14px;

            color: #777;
        }

        .register a {
            color: #111;

            font-weight: 600;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            Paradiso Nice View
        </div>

        <h1>
            Bentornato
        </h1>

        <p class="subtitle">
            Accedi al tuo account
        </p>


        <form onsubmit="controllaLogin(event)">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >


                <button
                    type="button"
                    class="face-button"
                    onclick="mostraPassword()"
                >

                    <div class="face">

                        <div class="eye eye-left"></div>

                        <div class="eye eye-right"></div>

                        <div class="mouth"></div>

                    </div>

                </button>

            </div>


            <a href="#" class="forgot">
                Password dimenticata?
            </a>


            <button
                type="submit"
                class="login-button"
            >
                Accedi
            </button>


            <p id="errore"></p>

        </form>


        <p class="register">

            Non hai un account?

            <a href="registrazione.html">
                Registrati
            </a>

        </p>

    </div>


    <script>

        function mostraPassword() {

            let password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }


        function controllaLogin(event) {

            event.preventDefault();

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;


            if (
                email === "prova@gmail.com" &&
                password === "1234"
            ) {

                window.location.href = "home.html";

            } else {

                document.getElementById("errore").textContent =
                    "Email o password errati";

            }

        }

    </script>

</body>

</html>
